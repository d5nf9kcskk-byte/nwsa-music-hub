# Every invariant this repo pins, as ONE list used by more than one workflow.
#
# It lives in a composite action rather than being copied into each workflow
# because a copy drifts: the next self-check gets added to the deploy workflow,
# nobody remembers the pull-request one, and the pull-request check quietly
# stops covering it — which is the same silent-failure shape the self-checks
# exist to catch. Adding a self-check means adding it HERE, once, and both
# callers get it.
#
# Deliberately free of secrets and of anything that needs the built site: a
# composite action cannot read the `secrets` context, so the build, the CSP
# check (which can only read the built index.html) and feed generation stay
# with the caller that has the credentials for them.
name: Self-checks
description: Run every pinned invariant self-check in this repository.

runs:
  using: composite
  steps:
    # Feed URLs are a frozen contract: this pins the view-feed slug hash and
    # the filter rules the feeds are built from (docs/release-checklist.md).
    - name: Check calendar view + ICS contracts
      run: node scripts/calendar-view.selfcheck.mjs
      shell: bash

    # Named bundles are subscription addresses too — pin their slugs and
    # their no-overlap guarantee the same way the view slugs are pinned.
    - name: Check calendar bundles
      run: node scripts/calendar-bundles.selfcheck.mjs
      shell: bash

    # The rich-text parser decides what students read on every assignment,
    # announcement and event note. Its self-check ran nowhere until now, so
    # a regression in it could ship green.
    - name: Check rich-text rendering
      run: npx tsx src/shared/richText.selfcheck.ts
      shell: bash

    # Which devices open IndexedDB for Firestore: public never, staff yes,
    # and a latched queue reloads once into memory. A regression here puts
    # the b815 assertion back on students' phones (firestoreCache.ts).
    - name: Check Firestore cache policy
      run: npx tsx src/director/firestoreCache.selfcheck.ts
      shell: bash

    # A contract is signed text: `termsText` is frozen verbatim at issue so
    # that editing a template never changes what someone already agreed to.
    # Now that the sheet renders that prose as RICH text, this renders the
    # real ContractPrintSheet and pins what the document says — every
    # starter template word for word, tokens resolved, and no javascript:
    # href reaching a signed page.
    - name: Contract sheet self-check (printed agreement)
      run: npx tsx --tsconfig tsconfig.app.json --import ./scripts/vite-defines-shim.mjs src/director/personnel/contractSheet.selfcheck.tsx
      shell: bash

    # Who a sign-up reaches. Drift here is silent — a director opens
    # "Camerata strings" and half the section never sees it (#signups).
    - name: Check sign-up eligibility
      run: node scripts/signup-eligibility.selfcheck.mjs
      shell: bash

    - name: Check sign-up interview slots
      run: npx tsx src/shared/signupSlots.selfcheck.ts
      shell: bash

    - name: Check sign-up slot times
      run: npx tsx --import ./scripts/vite-defines-shim.mjs src/shared/signupSlotTimes.selfcheck.ts
      shell: bash

    - name: Check sign-up slot parsing
      run: npx tsx --import ./scripts/vite-defines-shim.mjs src/shared/signupSlotParse.selfcheck.ts
      shell: bash

    # Reading a booked slot back (#signups). A hand-typed slot label has no
    # date in it, so it must never produce a calendar entry — that would put
    # a student's audition on the wrong day, silently.
    - name: Check booked sign-up slots
      run: npx tsx --import ./scripts/vite-defines-shim.mjs src/shared/signupBooking.selfcheck.ts
      shell: bash

    # A booked slot becomes a calendar appointment through ONE function,
    # read by the Schedule screen and by the appointmentsFeed endpoint. If
    # the two ever disagree, a director's subscribed calendar quietly stops
    # matching the screen that offered it (#signup-appointments).
    - name: Check sign-up appointments
      run: npx tsx src/shared/signupAppointments.selfcheck.ts
      shell: bash

    # A master class says who is playing by matching booked sign-up slots to
    # the meeting's own clock window — no stored link, so nothing warns you
    # when the match goes wrong. A slot pulled in from the wrong event, or a
    # rehearsal that starts announcing performers, is a wrong name on a
    # running order (#masterclass-performers).
    - name: Check event performers
      run: npx tsx src/shared/eventPerformers.selfcheck.ts
      shell: bash

    # A master class is iconed by the instrument read out of its own name,
    # through the one score-order ranking. "Bass Masterclass" is the case
    # that silently regresses: the ranking anchors the string bass as ^bass$,
    # so the class words have to come off the name first (#masterclass-icons).
    - name: Check group icons
      run: npx tsx src/director/groupIcon.selfcheck.ts
      shell: bash

    # Turning responses into roster students writes to real student records
    # on a typed name. Never removes an ensemble, never resolves an
    # ambiguous name to a victim, never makes one person twice (#signups).
    - name: Check sign-up roster intake
      run: npx tsx src/shared/signupRosterIntake.selfcheck.ts
      shell: bash

    # The concert door (#concert-checkin). The window is computed in
    # school-local time from a UTC server, whole-domain email matching keeps
    # notstudents.dadeschools.net out, and a duplicate scan is refused by the
    # doc id — all three are silent to break and loud to discover at a concert.
    - name: Check concert check-in rules
      run: npx tsx src/shared/concertCheckin.selfcheck.ts
      shell: bash

    # The concert-day banner (#concert-day-alert): today-only + non-cancelled
    # filtering, and the check-in link only appears when required AND the
    # station is actually on — never a fourth guess at "is this open?".
    - name: Check concert-day banner logic
      run: npx tsx src/shared/concertToday.selfcheck.ts
      shell: bash

    # The cumulative CSV: one row per student per concert, and a concert
    # counts only when BOTH scans exist.
    # No defines shim: the CSV module takes its config as an argument so the
    # Drive sync (plain node, no vite) can build the SAME file the director
    # downloads. Running it bare here keeps that honest.
    - name: Check concert attendance CSV
      run: npx tsx src/director/checkin/checkinCsv.selfcheck.ts
      shell: bash

    - name: Check concert photo Drive naming
      run: node scripts/drive-photo-names.selfcheck.mjs
      shell: bash

    # Shared/combined blocks: the predicate that decides whether several
    # ensembles on one event means "one room together" — and the guard that
    # the combined label never disturbs an ordinary event's VEVENT, which is
    # a live subscription contract.
    - name: Check shared-block semantics + frozen ICS shape
      run: node scripts/shared-block.selfcheck.mjs
      shell: bash

    # Combine + revert (#schedule-ux-redesign Phase 2): a combined block's
    # revert must re-create absorbed events under their ORIGINAL doc ids
    # (ICS UIDs derive from doc ids) and leave every student's resolved
    # schedule exactly where it started.
    - name: Check combine/revert round trip
      run: node scripts/schedule-combine.selfcheck.mjs
      shell: bash

    # Day plans (#schedule-ux-two-doors §3, Phase 4c): planDayChange must
    # report every collision (displacement is never silent), keep
    # snapshot-once changeFrom semantics on every write, and back-to-normal
    # must round-trip the whole day — absorbed blocks re-created under
    # their ORIGINAL doc ids (ICS UIDs derive from doc ids, frozen).
    - name: Check day-plan engine
      run: node scripts/schedule-day-plan.selfcheck.mjs
      shell: bash

    # Standing weekday rotations: `days` on RosterOverride decides which
    # ensemble a rotating student rehearses with, and generate-feeds.mjs
    # keeps its own copy of that predicate. This pins both, and that they
    # agree — divergence silently sends a student to the wrong room.
    - name: Check rotation weekday resolution
      run: node scripts/rotation-weekday.selfcheck.mjs
      shell: bash

    # Absence-email parsing/matching (docs/ABSENCE-EMAIL.md) — pinned so a
    # regex change can't silently start mismatching students or dates.
    # The launchd/Mail.app side (absence-email-local.mjs) runs only on the
    # director's Mac, matching how bulletin-local.mjs is kept out of CI too.
    - name: Check absence-email parsing
      run: node scripts/absence-email.selfcheck.mjs
      shell: bash

    # The office bulletin parser + its mapping to attendance, including the
    # TARDY split (#tardies): late to SCHOOL must never become a class
    # attendance mark. The self-check existed but ran nowhere in CI.
    - name: Check attendance bulletin parsing
      run: node scripts/attendance-bulletin.selfcheck.mjs
      shell: bash

    # Alert grouping and the easter-egg helpers. Both transitively import
    # src/org, whose __ORG_CONFIG__ is a Vite `define` — so they need the
    # shim to run outside Vite at all. They were silently unrunnable from
    # the white-label change until 2026-08-22; running them here is what
    # stops that recurring.
    - name: Check director/public alert grouping
      run: npx tsx --import ./scripts/vite-defines-shim.mjs src/shared/groupAlerts.selfcheck.ts
      shell: bash

    - name: Check easter-egg helpers
      run: npx tsx --import ./scripts/vite-defines-shim.mjs src/shared/whimsyEggs.selfcheck.ts
      shell: bash

    - name: Check ensemble/class classification
      run: npx tsx --import ./scripts/vite-defines-shim.mjs src/director/groupKind.selfcheck.ts
      shell: bash

    - name: Check piece movement selection
      run: npx tsx --import ./scripts/vite-defines-shim.mjs src/director/pieceMovements.selfcheck.ts
      shell: bash

    # Applied-lesson grading (#applied): the grade is a whole 0–100, a
    # cancelled lesson must never count, anything unreadable (including the
    # retired A–F letters) must be ignored rather than scored as a zero, and
    # the displayed average must round in exactly one place. No org import,
    # so no defines shim needed.
    - name: Check applied-lesson grading
      run: npx tsx src/director/lessonGrades.selfcheck.ts
      shell: bash

    # Which semester a screen opens on (#current-term): a date inside a term
    # IS that term, the gaps (summer, the winter break, before the first term
    # starts) resolve to something sensible rather than nothing, and an org
    # with no terms configured has no current term so its screens show
    # everything. Covered by the concert check-in self-check, which already
    # owns the term definition — listed here so the dependency is visible.

    # Playing-exam rubric (#exam-rubric): a half-filled rubric must produce
    # NO grade (an unscored line is not a zero), an EMPTY rubric on an exam
    # means "graded without one" and must never be re-defaulted, a confirmed
    # grade snapshots its own lines so re-weighting the exam cannot rewrite
    # it, and the percent must round in exactly one place. No org import, so
    # no defines shim needed.
    - name: Check playing-exam rubric
      run: npx tsx src/director/examRubric.selfcheck.ts
      shell: bash

    # Student Assistant approval gate (#approvals): taking roll must never
    # be queued, a director's own write must never be diverted (or approving
    # would queue itself), a field the assistant CLEARED must survive the
    # JSON round trip, and an already-decided request must never apply a
    # second time. No org import, so no defines shim needed.
    - name: Check the assistant approval gate
      run: npx tsx src/director/pendingActions.selfcheck.ts
      shell: bash

    # The grade sheet's CSV export: a hostile student name must be quoted AND
    # formula-neutralised, rubric points must land under the line they were
    # given for (matched by criterion id, never by position), a grade
    # snapshotted on an EARLIER rubric must leave non-matching cells blank
    # rather than misalign into the wrong column, and an ungraded student
    # must export blank — an unscored line is not a zero. No org import, so
    # no defines shim.
    - name: Check assignment grades CSV
      run: npx tsx src/director/assignments/assignmentGradesCsv.selfcheck.ts
      shell: bash

    # The grade row's video element (#exam-rubric): ONE player, belonging to
    # the open row alone, and an explicit preload="metadata". Omitting the
    # attribute lets the browser pull a 500 MB exam nobody asked for;
    # preload="none" renders a player that reads as unplayable and sends the
    # grader back to the link. Both are JSX attributes with no runtime
    # handle, so this checks the source text.
    - name: Check grade-row video element
      run: node scripts/grade-video.selfcheck.mjs
      shell: bash

    # High School lesson log (#applied): payroll defaults, initials gate,
    # "do not enqueue mail for incomplete / cancelled rows", one sheet per
    # student per term, and the five-line jury list.
    - name: Check applied lesson log
      run: npx tsx src/director/lessonLog.selfcheck.ts
      shell: bash

    # Standing weekly lesson time (#applied): expansion must land on the
    # right weekday, must never re-create a date that already has a lesson
    # (which would resurrect a cancelled one), and must stay bounded.
    # Imports the app's time formatter, so the org defines shim is needed.
    - name: Check weekly lesson slots
      run: npx tsx --import ./scripts/vite-defines-shim.mjs src/director/lessonSchedule.selfcheck.ts
      shell: bash

    # Booked sign-up time → standing weekly lesson (#signups, #applied). A
    # weekday derived one day off puts a student in the wrong room every
    # week for a year and nothing complains; a hand-typed slot label must
    # never be guessed onto a day; and a booking that converts to nothing
    # must say so rather than vanish.
    - name: Check sign-up times → weekly lessons
      run: npx tsx src/shared/signupToLessons.selfcheck.ts
      shell: bash

    # Juries (#juries): a bulk add must never reshuffle an order the director
    # already sequenced, an inactive student must never enter a jury, and a
    # sort must lose nobody — including an id whose student record is gone.
    - name: Check jury running order
      run: npx tsx src/director/juries/runningOrder.selfcheck.ts
      shell: bash

    - name: Check assignment submission query (no composite index)
      run: node scripts/assignment-submissions.selfcheck.mjs
      shell: bash

    - name: Check attendance status labels (Late Excused)
      run: node scripts/attendance-status.selfcheck.mjs
      shell: bash

    - name: Check announcement archive visibility
      run: npx tsx src/director/hooks/announcementsArchive.selfcheck.ts
      shell: bash

    - name: Check multi-role resolution
      run: npx tsx src/director/directorRoles.selfcheck.ts
      shell: bash

    - name: Check director assignment resolution
      run: npx tsx src/director/directorAssignments.selfcheck.ts
      shell: bash

    - name: Check MDC staff contact lookup
      run: npx tsx src/director/staffMdcContacts.selfcheck.ts
      shell: bash

    - name: Check masterclass section specs
      run: npx tsx src/director/masterclassSections.selfcheck.ts
      shell: bash

    - name: Check class schedule and AP Theory enrollment
      run: npx tsx src/director/classSchedule.selfcheck.ts
      shell: bash

    - name: Check student search fields
      run: npx tsx src/director/studentSearch.selfcheck.ts
      shell: bash

    - name: Check roster email recipients and mailto batching
      run: npx tsx src/director/rosterEmail.selfcheck.ts
      shell: bash
