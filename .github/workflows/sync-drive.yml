name: Sync videos to Google Drive

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync submissions to Drive
        run: node scripts/sync-drive-videos.mjs
        env:
          # Same Firebase SA already used by deploy-rules / backfill — also
          # authenticates to Drive (Drive API must be enabled on the GCP project).
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
