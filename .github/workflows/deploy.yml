name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh ICS feeds hourly. This is also how long someone waits for a
    # CUSTOM filter mix (several ensembles at once) to become subscribable:
    # its feed file is only written by this run, and a calendar app handed a
    # URL with no file behind it refuses the subscription outright rather
    # than retrying later. Four hours of that was the reported bug.
    # Safe to run this often because dist/sw.js is byte-identical for
    # unchanged source (see the [sw-precache] contract in CLAUDE.md) — an
    # unchanged build never toasts an open tab.
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Every pinned invariant in the repo, shared with the pull-request
      # check so both always run exactly the same list.
      - uses: ./.github/actions/self-checks

      - name: Build
        run: npm run build
        env:
          # App Check (rec #1): unset until the reCAPTCHA site key exists in
          # the Firebase console, and inert in the app while unset.
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # The CSP is generated into index.html at build time, so it can only be
      # checked here, against the built file. It has shipped broken twice and
      # both times it failed silently: connect-src missing the functions
      # origin (read as "that did not reach the Hub"), then media-src missing
      # entirely, which let a playing exam upload and refused to let it play
      # back. Nothing throws; the feature is just dead in the browser.
      - name: Check Content-Security-Policy
        run: node scripts/csp.selfcheck.mjs

      - name: Generate ICS calendar feeds
        run: node scripts/generate-feeds.mjs
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          # Optional: when present, feeds are read with a service account so
          # turning App Check enforcement on doesn't kill them (rec #1).
          # Absent → anonymous reads, exactly as before.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # Feed generation is deliberately non-fatal, so annotate instead of
      # failing: a green deploy serving 404 feeds must not go unnoticed.
      - name: Verify ICS feeds
        run: grep -q BEGIN:VEVENT dist/feeds/all.ics || echo "::error::ICS feed generation produced no events"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
