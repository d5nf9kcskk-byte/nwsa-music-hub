name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh ICS feeds hourly. This is also how long someone waits for a
    # CUSTOM filter mix (several ensembles at once) to become subscribable:
    # its feed file is only written by this run, and a calendar app handed a
    # URL with no file behind it refuses the subscription outright rather
    # than retrying later. Four hours of that was the reported bug.
    # Safe to run this often because dist/sw.js is byte-identical for
    # unchanged source (see the [sw-precache] contract in CLAUDE.md) — an
    # unchanged build never toasts an open tab.
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Feed URLs are a frozen contract: this pins the view-feed slug hash and
      # the filter rules the feeds are built from (docs/release-checklist.md).
      - name: Check calendar view + ICS contracts
        run: node scripts/calendar-view.selfcheck.mjs

      # Named bundles are subscription addresses too — pin their slugs and
      # their no-overlap guarantee the same way the view slugs are pinned.
      - name: Check calendar bundles
        run: node scripts/calendar-bundles.selfcheck.mjs

      # The rich-text parser decides what students read on every assignment,
      # announcement and event note. Its self-check ran nowhere until now, so
      # a regression in it could ship green.
      - name: Check rich-text rendering
        run: npx tsx src/shared/richText.selfcheck.ts

      # Who a sign-up reaches. Drift here is silent — a director opens
      # "Camerata strings" and half the section never sees it (#signups).
      - name: Check sign-up eligibility
        run: node scripts/signup-eligibility.selfcheck.mjs

      - name: Check sign-up interview slots
        run: npx tsx src/shared/signupSlots.selfcheck.ts

      - name: Check sign-up slot times
        run: npx tsx --import ./scripts/vite-defines-shim.mjs src/shared/signupSlotTimes.selfcheck.ts

      # Shared/combined blocks: the predicate that decides whether several
      # ensembles on one event means "one room together" — and the guard that
      # the combined label never disturbs an ordinary event's VEVENT, which is
      # a live subscription contract.
      - name: Check shared-block semantics + frozen ICS shape
        run: node scripts/shared-block.selfcheck.mjs

      # Combine + revert (#schedule-ux-redesign Phase 2): a combined block's
      # revert must re-create absorbed events under their ORIGINAL doc ids
      # (ICS UIDs derive from doc ids) and leave every student's resolved
      # schedule exactly where it started.
      - name: Check combine/revert round trip
        run: node scripts/schedule-combine.selfcheck.mjs

      # Standing weekday rotations: `days` on RosterOverride decides which
      # ensemble a rotating student rehearses with, and generate-feeds.mjs
      # keeps its own copy of that predicate. This pins both, and that they
      # agree — divergence silently sends a student to the wrong room.
      - name: Check rotation weekday resolution
        run: node scripts/rotation-weekday.selfcheck.mjs

      # Absence-email parsing/matching (docs/ABSENCE-EMAIL.md) — pinned so a
      # regex change can't silently start mismatching students or dates.
      # The launchd/Mail.app side (absence-email-local.mjs) runs only on the
      # director's Mac, matching how bulletin-local.mjs is kept out of CI too.
      - name: Check absence-email parsing
        run: node scripts/absence-email.selfcheck.mjs

      # The office bulletin parser + its mapping to attendance, including the
      # TARDY split (#tardies): late to SCHOOL must never become a class
      # attendance mark. The self-check existed but ran nowhere in CI.
      - name: Check attendance bulletin parsing
        run: node scripts/attendance-bulletin.selfcheck.mjs

      # Alert grouping and the easter-egg helpers. Both transitively import
      # src/org, whose __ORG_CONFIG__ is a Vite `define` — so they need the
      # shim to run outside Vite at all. They were silently unrunnable from
      # the white-label change until 2026-08-22; running them here is what
      # stops that recurring.
      - name: Check director/public alert grouping
        run: npx tsx --import ./scripts/vite-defines-shim.mjs src/shared/groupAlerts.selfcheck.ts

      - name: Check easter-egg helpers
        run: npx tsx --import ./scripts/vite-defines-shim.mjs src/shared/whimsyEggs.selfcheck.ts

      - name: Check ensemble/class classification
        run: npx tsx --import ./scripts/vite-defines-shim.mjs src/director/groupKind.selfcheck.ts

      # Applied-lesson grading (#applied): a cancelled lesson must never count,
      # an unrecognized mark must be ignored rather than scored as a zero, and
      # the letter boundary must round to the better grade. No org import, so
      # no defines shim needed.
      - name: Check applied-lesson grading
        run: npx tsx src/director/lessonGrades.selfcheck.ts

      # Juries (#juries): a bulk add must never reshuffle an order the director
      # already sequenced, an inactive student must never enter a jury, and a
      # sort must lose nobody — including an id whose student record is gone.
      - name: Check jury running order
        run: npx tsx src/director/juries/runningOrder.selfcheck.ts

      - name: Check announcement archive visibility
        run: npx tsx src/director/hooks/announcementsArchive.selfcheck.ts

      - name: Build
        run: npm run build
        env:
          # App Check (rec #1): unset until the reCAPTCHA site key exists in
          # the Firebase console, and inert in the app while unset.
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Generate ICS calendar feeds
        run: node scripts/generate-feeds.mjs
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          # Optional: when present, feeds are read with a service account so
          # turning App Check enforcement on doesn't kill them (rec #1).
          # Absent → anonymous reads, exactly as before.
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # Feed generation is deliberately non-fatal, so annotate instead of
      # failing: a green deploy serving 404 feeds must not go unnoticed.
      - name: Verify ICS feeds
        run: grep -q BEGIN:VEVENT dist/feeds/all.ics || echo "::error::ICS feed generation produced no events"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
