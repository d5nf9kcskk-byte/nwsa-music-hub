name: Deploy Firestore & Storage rules

# Deploys the Firestore AND Storage security rules automatically whenever they
# change on main, using the same service account the other admin tasks use.
# This closes the last manual step: editing either rules file no longer needs a
# hand-run `firebase deploy` — the rules go live with the change that made them.
#
# Storage rules were excluded here until Aug 2026, because Firebase Storage
# requires the Blaze plan and there was no bucket on Spark: the deploy failed
# with "fetching default storage bucket … 403 / may not exist" and dragged the
# whole job — including the Firestore rules — down with it.
#
# The bucket now exists (gs://nwsa-hub.firebasestorage.app, us-central1), so
# Storage rules deploy again. They run as their OWN step, AFTER Firestore, so
# that the original failure mode cannot come back: if a Storage deploy ever
# fails, Firestore's rules have already shipped and only the Storage step goes
# red. The job failing is the point — a security-rules deploy that silently
# no-ops is worse than a visible failure — so this step is deliberately NOT
# `continue-on-error`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-rules.yml'

# Never let two rule deploys race.
concurrency:
  group: deploy-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # firebase-tools authenticates via a service-account key file pointed to
      # by GOOGLE_APPLICATION_CREDENTIALS. Write the secret JSON to a temp file.
      - name: Write service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret is not set — aborting." >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Firestore first, deliberately. If Storage ever fails, these are already
      # live and the blast radius is one step instead of the whole job.
      - name: Deploy Firestore rules
        run: |
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules \
            --project nwsa-hub \
            --non-interactive

      - name: Deploy Storage rules
        run: |
          npx --yes firebase-tools@13 deploy \
            --only storage \
            --project nwsa-hub \
            --non-interactive

      # ── Demo org (#org-config) ─────────────────────────────────────────
      # The ASYO demo runs the SAME rules against its own project, and used
      # to need a hand-run `firebase deploy` after every rules merge — the
      # "rules drift" gotcha in docs/demo-asyo-setup.md, and a security
      # footgun, since forgetting it left the demo on stale rules
      # indefinitely. These steps retire that.
      #
      # They run LAST and skip cleanly when the demo secret is absent, so a
      # repo without the demo configured behaves exactly as before and the
      # NWSA rules above have already shipped either way.
      - name: Write demo service-account key
        id: demo_key
        env:
          ASYO_SERVICE_ACCOUNT_JSON: ${{ secrets.ASYO_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$ASYO_SERVICE_ACCOUNT_JSON" ]; then
            echo "ASYO_SERVICE_ACCOUNT_JSON not set — skipping the demo rules deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ASYO_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/asyo-sa.json"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Firestore only. The demo project is on Spark, which has no Storage
      # bucket — a storage deploy there fails exactly the way it did for NWSA
      # before the upgrade. Add a storage step here if the demo ever moves to
      # Blaze.
      - name: Deploy Firestore rules (ASYO demo)
        if: steps.demo_key.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/asyo-sa.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules \
            --project asyo-hub-demo \
            --non-interactive

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/asyo-sa.json"
