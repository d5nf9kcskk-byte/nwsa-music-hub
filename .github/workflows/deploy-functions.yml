name: Deploy Cloud Functions

# The private lessons calendar endpoint (#lessons-feed), each director's
# sign-up appointments calendar (#signup-appointments), each staff member's
# own schedule (#my-calendar), the concert door
# (#concert-checkin), the tally behind a student's concert count, the
# sign-up confirmation email (#signups — it writes the `mail` doc server-side
# precisely so the public page never can), the public "yes, it uploaded"
# submission receipt (#video-upload-reliability Phase 1 — it writes
# `submissionReceiptsPublic` server-side so a receipt can never be forged),
# and turning a chunked upload's parts into a real submission
# (#video-upload-reliability Phase 2 — the combined-size check against the
# assignment's real limit, and the GCS compose call itself, both need a
# service credential the browser never holds). Kept in
# their own
# workflow, not folded into the Pages deploy, for the reason the feature
# exists at all: nothing this function produces may ever enter the Pages
# artifact, which is publicly downloadable on this repo.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/shared/ics.ts'
      - 'src/shared/richTextParse.ts'
      # Bundled into signupConfirmation / appointmentsFeed — editing one of
      # these changes a deployed function even though nothing under
      # functions/ moved.
      - 'src/shared/signupBooking.ts'
      - 'src/shared/signupSlots.ts'
      - 'src/shared/signupAppointments.ts'
      # Bundled into staffFeed — the SHARED view filter and the SHARED
      # assignment resolver, so "what counts as mine" cannot drift between
      # the Schedule screen and the subscribed calendar (#my-calendar).
      - 'src/shared/calendarView.ts'
      - 'src/director/directorAssignments.ts'
      # Bundled into lessonLogMailSend — the subject and body a family reads
      # come from these, shared with the in-app "Open in Mail" fallback so the
      # two cannot tell a family different things (#applied).
      - 'src/director/lessonLog.ts'
      - 'src/director/lessonGrades.ts'
      # Bundled into submissionReceipt — the ONE definition of the receipt's
      # shape, shared with the public-site hook that reads it, so the two
      # cannot drift (#video-upload-reliability Phase 1).
      - 'src/shared/submissionReceipts.ts'
      # Bundled into composeSubmission — the chunk-path/doc-id conventions
      # shared with the client-side uploader, so the function lists exactly
      # where the browser put the pieces (#video-upload-reliability Phase 2).
      - 'src/shared/submissionChunks.ts'
      - 'src/director/types.ts'
      - 'config/orgs/nwsa.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No credential, no deploy — never a half-configured endpoint.
    if: github.repository == 'd5nf9kcskk-byte/nwsa-music-hub'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Runs before any credential is written: a broken guard must fail the
      # build, not deploy and then fail.
      - name: Check the lessons, appointments, my-calendar, check-in, tally, the two email guards, the submission receipt, and the chunk compose step
        run: |
          npm --prefix functions ci
          npm --prefix functions run selfcheck

      # A functions deploy needs MORE than the rules deploy does, and the
      # errors name the resource but never the caller — the same trap PR #49
      # hit on Storage. Printing client_email turns "grant the right account"
      # from a guess into a copy-paste. It is an identifier, not a
      # credential; the key stays in the temp file, shredded below.
      #
      # The deploying account is firebase-adminsdk-fbsvc@nwsa-hub.iam.gserviceaccount.com
      # (a service account email is an identifier, not a credential, and this
      # one is already printed in the public run log). In IAM, that is the row
      # to edit — NOT nwsa-hub@appspot.gserviceaccount.com, which is only the
      # account being acted upon and whose own roles this deploy does not need.
      #
      # Required on the deploying account, beyond what rules need:
      #   • Cloud Functions Admin      (roles/cloudfunctions.admin)
      #   • Service Account User       (roles/iam.serviceAccountUser) — must
      #     cover nwsa-hub@appspot.gserviceaccount.com, the account a v1
      #     function RUNS as. Without it: "Missing permissions required for
      #     functions deploy … iam.serviceAccounts.ActAs".
      # IAM grants can take a few minutes to propagate; a failure immediately
      # after granting is often lag, not a wrong grant (again, see PR #49).
      #
      # Also enable these APIs on the project by hand. firebase-tools turns
      # them on itself when it can, but this account has no
      # serviceusage.services.enable, so each one surfaces as "Permissions
      # denied enabling <api>" — one at a time, as the deploy reaches it:
      #   cloudfunctions.googleapis.com
      #   cloudbuild.googleapis.com
      #   artifactregistry.googleapis.com
      #   cloudbilling.googleapis.com   — only a READ of the billing status,
      #     to confirm the project is on Blaze. Enabling the API neither
      #     enables billing nor costs anything.
      # (firebaseextensions.googleapis.com also gets attempted, but failing to
      # enable it is a warning, not a deploy failure.)
      - name: Deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not set — cannot deploy functions"
            exit 1
          fi
          # Shred on EVERY exit path. Actions runs `run:` under `bash -e`, so
          # a failed deploy leaves the step at once and a trailing shred line
          # never executes — which is exactly what happened on each failed
          # attempt that preceded this endpoint going live. The runner is
          # thrown away either way, but a step that means to destroy a key
          # should not quietly skip it on the one path where something already
          # went wrong.
          trap 'shred -u "$RUNNER_TEMP/sa.json" 2>/dev/null || rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          echo "Deploying as: $(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/sa.json")).get("client_email","<unknown>"))')"
          # --force keeps a working deploy from reporting as a failure.
          # firebase-tools ends every deploy by trying to set an Artifact
          # Registry cleanup policy; without --force that attempt exits 1
          # AFTER "Successful create operation", so a function that is live
          # and answering reports red. It runs INSIDE `firebase deploy`, so a
          # separate setpolicy step cannot rescue it — the deploy has already
          # exited and the later step is skipped.
          #
          # Nothing destructive rides along. --force also suppresses the
          # confirmation for deleting functions absent from the source, but
          # --only scopes that to the functions named below.
          #
          # EVERY function, not just the feed. This said `--only
          # functions:lessonsFeed` from the day it was written, so
          # concertCheckin and concertTally were exported from index.ts,
          # guarded by a self-check that ran on every push, and never
          # deployed. The endpoint answered Google's HTML 404 rather than a
          # refusal, and the page turned that into "The Hub gave an answer we
          # could not read" — found at 2:55pm on 2026-08-31, three hours
          # before the first concert that needed it. A function added to
          # index.ts must be added HERE too or it does not exist.
          #
          # --force alone did NOT set the policy, though. For several runs
          # it only downgraded the failure to a warning ("Failed to set up
          # cleanup policy for repositories in region us-central1"), which
          # made it a permissions limit rather than a prompt one: the
          # deploying account could not write Artifact Registry policy, so
          # images accumulated.
          #
          # Resolved 2026-08-22 by granting the deploying account Artifact
          # Registry Repository Administrator
          # (roles/artifactregistry.repoAdmin — the narrower role is enough;
          # full artifactregistry.admin is not needed). The warning is gone
          # from the log and the policy now sets itself on every deploy. If
          # it ever comes back, that grant is what went missing.
          npx --yes firebase-tools@latest deploy \
            --only functions:lessonsFeed,functions:appointmentsFeed,functions:staffFeed,functions:concertCheckin,functions:concertTally,functions:signupConfirmation,functions:lessonLogMailSend,functions:submissionReceipt,functions:composeSubmission \
            --project nwsa-hub \
            --non-interactive \
            --force
