name: Seed Director Assignments

# Owner-curated conducting / teaching assignments + MDC staff contact sync
# onto each ensemble/class doc. Cloud agents trigger via push to
# `.github/triggers/seed-director-assignments`.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would change without writing anything'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/triggers/seed-director-assignments'

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Seed director ensemble/class assignments
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && EXTRA="--dry-run"
          elif [ -f .github/triggers/seed-director-assignments ]; then
            grep -q '"dry_run"[[:space:]]*:[[:space:]]*true' .github/triggers/seed-director-assignments && EXTRA="--dry-run"
          fi
          node scripts/seed-director-assignments.mjs $EXTRA
