name: Post Sign-up

# Posts one sign-up into Firestore from a JSON file in `config/signups/`, for
# when it has to go up and nobody is at a signed-in browser. The Director
# Panel remains the normal way to create one — this writes the same doc.
#
# A sign-up and everything in its file are world-readable (title, groups,
# deadline, the address of a BLANK form). Never put a student, a response or
# an invite list in one — those are made in the app.
#
# Run dry first, read the doc in the log, then apply.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to the sign-up JSON (e.g. config/signups/freedom-tower-2026-10-04.json)'
        required: true
      dry_run:
        description: 'Validate and print the doc without writing anything'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install firebase-admin --no-save
      - name: Post the sign-up
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SIGNUP_FILE: ${{ inputs.file }}
        run: node scripts/post-signup.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
