name: Post Assignment

# Posts one assignment (playing exam, written test, performance task) into
# Firestore from a JSON file in `config/assignments/`, for when it has to go
# up and nobody is at a signed-in browser. The Director Panel remains the
# normal way to create one — this writes the same doc, the same shape.
#
# The exam text is a file rather than an input box because an eighteen-part
# playing exam does not fit in the Actions tab, and a file is a reviewable
# diff. Assignments are world-readable coursework, not student data.
#
# Run dry first, read the doc in the log, then apply.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to the assignment JSON (e.g. config/assignments/symphony-playing-exam-2.json)'
        required: true
      dry_run:
        description: 'Validate and print the doc without writing anything'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install firebase-admin --no-save
      - name: Post the assignment
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ASSIGNMENT_FILE: ${{ inputs.file }}
        run: node scripts/post-assignment.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
