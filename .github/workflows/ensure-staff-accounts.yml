name: Ensure Staff Accounts

# Makes sure every email on the Directors list has a sign-in account the Hub
# made (#password-sign-in). New listings get theirs from the
# staffAccountOnListing Cloud Function; this runs the same code once over the
# people already listed. It must report nothing missing BEFORE Email/Password
# sign-in is enabled for the project: docs/password-sign-in.md has the order.
#
# Manual only, and it only LOOKS unless "apply" is ticked. The log carries
# counts and never an address.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Make the missing accounts (unticked: count only, change nothing)'
        type: boolean
        default: false
      replace:
        description: 'Also replace accounts that carry a password. Only if Email/Password was enabled too early. Takes every chosen password away.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install firebase-admin --no-save
      - name: Ensure every listed email has an account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APPLY: ${{ inputs.apply && '1' || '' }}
          REPLACE: ${{ inputs.replace && '1' || '' }}
        run: node scripts/ensure-staff-accounts.mjs
