name: Repair assignment submissions

# Creates assignmentSubmissions docs for videos in Storage that never got a
# Firestore row (or whose row the grade sheet could not list). Idempotent on
# videoUrl. Runs hourly with --apply — the script's own LOOKBACK_DAYS keeps
# that affordable by skipping assignments due more than 30 days ago. A manual
# workflow_dispatch defaults to dry-run so someone can preview before writing.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write docs (true) or dry-run (false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      assignment_ids:
        description: 'Optional space-separated assignment ids (default: all video exams)'
        required: false
        default: ''
  schedule:
    # Hourly, offset from the on-the-hour/quarter-hour crons in deploy.yml,
    # deploy-demo.yml and deploy-as.yml.
    - cron: '45 * * * *'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install firebase-admin --no-save
      - name: Repair submission docs from Storage
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS+=(--apply)
          fi
          # shellcheck disable=SC2206
          IDS=(${{ inputs.assignment_ids }})
          for id in "${IDS[@]+"${IDS[@]}"}"; do
            [ -n "$id" ] && ARGS+=(--assignment "$id")
          done
          node scripts/repair-assignment-submissions.mjs "${ARGS[@]}"
