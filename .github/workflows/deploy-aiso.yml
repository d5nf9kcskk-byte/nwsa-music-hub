name: Deploy AISO

# Fourth-org deployment (#org-config, #personnel): builds this same codebase
# with VITE_ORG=aiso against the aisymphony-hub Firebase project and pushes the
# built site to the thin `aiso-music-hub` repo's gh-pages branch (GitHub Pages
# ties one site to one repo; that repo holds zero source). Mirrors
# deploy-as.yml and is kept fully separate from deploy.yml so a failure here
# can never block or slow the NWSA deploy.
#
# AISO (the Atlanta International Symphony Orchestra) is a real orchestra,
# not a demo. One-time setup lives in docs/aiso-setup.md (Firebase project,
# the AISO_* secrets, the deploy key on the target repo). Until
# AISO_DEPLOY_KEY exists the SCHEDULED run skips itself with a warning, so the
# school's Actions tab is not red every hour; a run started by hand still
# fails loudly at the publish step.

on:
  workflow_dispatch:
  schedule:
    # Refresh ICS feeds hourly, offset from the NWSA (:00), ASYO (:15) and AS
    # (:30) deploys and from the :45 submissions repair. Hourly because the
    # subscribe sheet tells every org "usually within the hour" when a custom
    # filter mix has no feed file yet.
    - cron: '50 * * * *'

permissions:
  contents: read

concurrency:
  group: aiso-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Don't run the cron in forks.
    if: ${{ github.repository_owner == 'd5nf9kcskk-byte' }}
    steps:
      - name: Is AISO provisioned?
        id: ready
        env:
          KEY: ${{ secrets.AISO_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "::warning::AISO is not provisioned yet (docs/aiso-setup.md); nothing deployed."
            echo go=false >> "$GITHUB_OUTPUT"
          else
            echo go=true >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v7

      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: steps.ready.outputs.go == 'true'
        run: npm ci

      - name: Build (AISO org)
        if: steps.ready.outputs.go == 'true'
        run: npm run build
        env:
          VITE_ORG: aiso
          VITE_FIREBASE_API_KEY: ${{ secrets.AISO_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.AISO_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.AISO_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.AISO_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AISO_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.AISO_FIREBASE_APP_ID }}
          # App Check (#member-sign-in): the passwordSetup function refuses a
          # request without a token, so player invitations and passwords
          # need this key. Empty until set; the site still builds.
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.AISO_RECAPTCHA_SITE_KEY }}

      # AISO's boot script differs from the school's (hub2Everyone), the case
      # the CSP check's inline-script hash test exists for.
      - name: Check the CSP
        if: steps.ready.outputs.go == 'true'
        run: node scripts/csp.selfcheck.mjs

      - name: Generate ICS calendar feeds
        if: steps.ready.outputs.go == 'true'
        run: node scripts/generate-feeds.mjs
        env:
          ORG: aiso
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.AISO_FIREBASE_PROJECT_ID }}

      - name: Verify ICS feeds
        if: steps.ready.outputs.go == 'true'
        run: grep -q BEGIN:VEVENT dist/feeds/all.ics || echo "::error::ICS feed generation produced no events"

      - name: Publish to aiso-music-hub gh-pages
        if: steps.ready.outputs.go == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: d5nf9kcskk-byte/aiso-music-hub
          publish_branch: gh-pages
          publish_dir: dist
          deploy_key: ${{ secrets.AISO_DEPLOY_KEY }}
          # GitHub Pages must not run Jekyll over the built site.
          enable_jekyll: false
          # The app lives at app.aisymphonyorchestra.org; the bare domain is kept
          # free for a future website. Without this every deploy would drop the CNAME file and Pages
          # would forget the custom domain.
          cname: app.aisymphonyorchestra.org
          commit_message: 'Deploy AISO from ${{ github.sha }}'
