name: Apply Attendance Bulletin

# Daily MDC Outlook "Attendance Bulletin" PDF → office-sourced Hub roll marks.
# Power Automate watches ggilman@mdc.edu and POSTs repository_dispatch:
#   event_type: attendance-bulletin
#   client_payload: { text, date?, dry_run? }
#
# Prefer sending extracted layout TEXT (not raw PDF base64) — GitHub dispatch
# payloads are size-capped. See docs/ATTENDANCE-BULLETIN.md.
#
# Default DRY_RUN=true until soft-launch is done. Pass dry_run: "false" to write.

on:
  repository_dispatch:
    types: [attendance-bulletin]
  workflow_dispatch:
    inputs:
      date:
        description: 'Bulletin date YYYY-MM-DD (optional override)'
        required: false
      dry_run:
        description: 'Dry run (true/false). Default true.'
        required: false
        default: 'true'
      bulletin_text:
        description: 'pdftotext -layout paste for a one-off test'
        required: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Self-check parser
        run: node scripts/attendance-bulletin.selfcheck.mjs
      - name: Install firebase-admin
        run: npm install firebase-admin --no-save
      - name: Apply bulletin
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BULLETIN_DATE: ${{ github.event.client_payload.date || inputs.date }}
          BULLETIN_TEXT: ${{ github.event.client_payload.text || inputs.bulletin_text }}
          BULLETIN_PDF_BASE64: ${{ github.event.client_payload.pdf_base64 }}
          DRY_RUN: ${{ github.event.client_payload.dry_run || inputs.dry_run || 'true' }}
        run: node scripts/apply-attendance-bulletin.mjs
