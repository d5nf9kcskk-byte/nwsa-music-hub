name: Remove No-School Lessons

# DELETES applied lessons on a day MDCPS is closed (#no-school-lessons): there
# were never going to be lessons on a holiday, a break or a planning day, so
# they are removed rather than left reading "Cancelled". Deletes `lessons` and
# its `lessonsPublic` mirror in one batch; the student feeds drop them on the
# next hourly refresh. Leaves alone anything GRADED, anything with files, and
# anything before `from` (default today). Replaced Cancel No-School Lessons.
#
# Run dry first and read the counts, then apply.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Only lessons on or after this date (YYYY-MM-DD). Blank = today.'
        required: false
      dry_run:
        description: 'List what would change without writing anything'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install firebase-admin --no-save
      - name: Remove no-school lessons from Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          [ "$INPUT_DRY" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "$INPUT_FROM" ] && ARGS="$ARGS --from=$INPUT_FROM"
          node scripts/remove-no-school-lessons.mjs $ARGS
