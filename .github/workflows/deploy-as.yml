name: Deploy AS demo

# Third-org deployment (#org-config, #personnel): builds this same codebase
# with VITE_ORG=as against the as-hub-demo Firebase project and pushes the
# built site to the thin `as-music-hub` repo's gh-pages branch (GitHub Pages
# ties one site to one repo; that repo holds zero source). Mirrors
# deploy-demo.yml (the ASYO demo) and is kept fully separate from deploy.yml
# so a demo failure can never block or slow the NWSA deploy.
#
# One-time setup lives in docs/demo-as-setup.md (Firebase project, the
# AS_* secrets, the deploy key on the target repo). Until those secrets
# exist this workflow can only be run by hand, and the build fails fast on
# the missing Firebase config — that is expected, not a bug.

on:
  workflow_dispatch:
  schedule:
    # Refresh demo ICS feeds hourly, offset from the NWSA (:00) and ASYO
    # (:15) crons. Hourly because the subscribe sheet tells every org
    # "usually within the hour" when a custom filter mix has no feed file yet.
    - cron: '30 * * * *'

permissions:
  contents: read

concurrency:
  group: as-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Don't run the cron in forks or before secrets exist.
    if: ${{ github.repository_owner == 'd5nf9kcskk-byte' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (AS org)
        run: npm run build
        env:
          VITE_ORG: as
          VITE_FIREBASE_API_KEY: ${{ secrets.AS_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.AS_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.AS_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.AS_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.AS_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.AS_FIREBASE_APP_ID }}

      - name: Generate ICS calendar feeds
        run: node scripts/generate-feeds.mjs
        env:
          ORG: as
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.AS_FIREBASE_PROJECT_ID }}

      - name: Verify ICS feeds
        run: grep -q BEGIN:VEVENT dist/feeds/all.ics || echo "::error::ICS feed generation produced no events"

      - name: Publish to as-music-hub gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: d5nf9kcskk-byte/as-music-hub
          publish_branch: gh-pages
          publish_dir: dist
          deploy_key: ${{ secrets.AS_DEPLOY_KEY }}
          # GitHub Pages must not run Jekyll over the built site.
          enable_jekyll: false
          commit_message: 'Deploy AS demo from ${{ github.sha }}'
