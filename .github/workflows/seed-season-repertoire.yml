name: Seed season repertoire

# Upserts the confirmed season repertoire into Firestore `repertoire` and links
# the pieces onto their concert events. The script is idempotent on its stable
# `rp26-*` document IDs, so re-running only overwrites the seeded fields.
#
# Manual only — repertoire is a deliberate act, not something that should fire
# on every push to main.
#
# `sweep-only` runs neither the piece upserts nor the concert links — just the
# events pass that drops `pieceMovements` keys for pieces an event no longer
# programs. Use it when the reason to run is the sweep: the CONCERTS table in
# the script is the season AS SEEDED, and a concert re-programmed in the app
# since (oc26-cco-concert-sep, Sept 2026) would be handed its seeded program
# back by a full run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        default: full
        options: [full, sweep-only]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin --no-save
      - name: Upsert season repertoire
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/seed-season-repertoire.mjs ${{ inputs.mode == 'sweep-only' && '--sweep-only' || '' }}
