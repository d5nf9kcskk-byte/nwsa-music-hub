<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>__ORG_APPNAME__</title>

    <!-- PWA / iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="__ORG_BRANDNAME__" />
    <meta name="theme-color" content="__ORG_THEMECOLOR__" />

    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="__ORG_FAVICONTYPE__" href="%BASE_URL%__ORG_FAVICONFILE__" />
    <link rel="apple-touch-icon" href="%BASE_URL%__ORG_APPLETOUCHICON__" />
  </head>
  <!-- spellcheck: Firefox's default checks multi-line boxes only, so every
       single-line Title field went unchecked there. The attribute inherits,
       so this covers the app; fields that opt OUT (search boxes, pasted
       blobs, addresses) set spellcheck={false} explicitly, which wins. -->
  <body spellcheck="true">
    <!-- Dark-view choice (#dark-view): resolve Auto/Light/Dark before first
         paint so a stored choice never flashes the wrong scheme. Kept current
         after load by src/public/theme.ts. -->
    <script>
      (function () {
        var choice = null;
        try { choice = localStorage.getItem('pub.theme'); } catch (e) { /* private mode */ }
        var dark = choice === 'dark' ||
          (choice !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-pub-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <div id="root"></div>
    <!-- GitHub Pages SPA fix: restore the URL saved by 404.html on refresh/direct link -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          if (redirect !== location.href) {
            history.replaceState(null, null, redirect);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
