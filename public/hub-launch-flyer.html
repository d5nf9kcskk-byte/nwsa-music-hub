<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NWSA Music Hub — Launch flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body {
      font-family: Outfit, system-ui, sans-serif;
      background: #1a3d50;
      color: #fff;
    }
    .sheet {
      width: 8.5in;
      min-height: 11in;
      margin: 0 auto;
      padding: 0.45in 0.5in 0.4in;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, rgba(200, 165, 42, 0.45), transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 40%, rgba(123, 53, 120, 0.55), transparent 50%),
        radial-gradient(ellipse 70% 50% at 0% 60%, rgba(13, 126, 142, 0.65), transparent 50%),
        linear-gradient(165deg, #0a5f6c 0%, #0d7e8e 28%, #5a2d68 72%, #7b3578 100%);
      position: relative;
      overflow: hidden;
    }
    .sheet::before {
      content: "";
      position: absolute;
      inset: 0.22in;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-radius: 18px;
      pointer-events: none;
    }
    .sheet::after {
      content: "";
      position: absolute;
      inset: 0.32in;
      border: 1px solid rgba(200, 165, 42, 0.55);
      border-radius: 12px;
      pointer-events: none;
    }
    .logo {
      width: 1.35in;
      height: auto;
      margin-top: 0.15in;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.35));
      position: relative;
      z-index: 1;
    }
    .school {
      margin: 0.18in 0 0;
      font-size: 11pt;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      position: relative;
      z-index: 1;
    }
    .headline {
      margin: 0.22in 0 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 900;
      font-size: 42pt;
      line-height: 1.02;
      letter-spacing: -0.02em;
      max-width: 7in;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 1;
    }
    .headline em {
      font-style: normal;
      color: #f0d56a;
    }
    .tag {
      margin: 0.18in auto 0;
      font-size: 15pt;
      font-weight: 600;
      line-height: 1.35;
      max-width: 28ch;
      color: rgba(255, 255, 255, 0.95);
      position: relative;
      z-index: 1;
    }
    .qr-wrap {
      margin: 0.32in auto 0;
      width: 4.15in;
      padding: 0.28in;
      background: #fff;
      border-radius: 22px;
      box-shadow:
        0 0 0 6px rgba(200, 165, 42, 0.85),
        0 18px 40px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 1;
    }
    .qr-wrap img, .qr-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .scan {
      margin: 0.22in 0 0;
      font-size: 18pt;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f0d56a;
      position: relative;
      z-index: 1;
    }
    .spacer { flex: 1; min-height: 0.2in; }
    .cta {
      width: 100%;
      max-width: 7.2in;
      margin-top: 0.2in;
      padding: 0.22in 0.28in;
      background: rgba(0, 0, 0, 0.28);
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 14px;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(4px);
    }
    .cta-label {
      font-size: 11pt;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 0.08in;
    }
    .cta-url {
      font-size: 13.5pt;
      font-weight: 800;
      word-break: break-all;
      color: #fff;
      line-height: 1.35;
    }
    .noprint {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .noprint button {
      font-family: Outfit, system-ui, sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      background: #f0d56a;
      color: #1a3d50;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    @media print {
      @page { size: letter portrait; margin: 0; }
      body { background: #fff; }
      .noprint { display: none !important; }
      .sheet {
        width: 8.5in;
        height: 11in;
        min-height: 11in;
        margin: 0;
      }
    }
    @media screen {
      body { padding: 24px 12px 48px; }
      .sheet {
        border-radius: 12px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
    }
  </style>
</head>
<body>
  <div class="noprint">
    <button type="button" onclick="window.print()">Print flyer</button>
  </div>
  <main class="sheet">
    <img class="logo" src="nwsa-logo.png" alt="New World School of the Arts" />
    <p class="school">New World School of the Arts</p>
    <h1 class="headline">The new<br /><em>NWSA Music Hub</em><br />is here</h1>
    <p class="tag">Schedules, parts, concerts &amp; announcements — one place for every music student and family.</p>
    <div class="qr-wrap" aria-label="QR code to open the Music Hub">
      <img src="hub-launch-qr.svg" alt="Scan to open NWSA Music Hub" width="512" height="512" />
    </div>
    <p class="scan">Scan to open</p>
    <div class="spacer" aria-hidden="true"></div>
    <div class="cta">
      <div class="cta-label">Or type this address</div>
      <div class="cta-url">https://d5nf9kcskk-byte.github.io/nwsa-music-hub/</div>
    </div>
  </main>
</body>
</html>
